name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Backend ────────────────────────────────────────────────────────────────
  backend:
    name: Backend (lint · typecheck · test · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run tests
        env:
          DATABASE_URL: "file:/tmp/test.db"
          JWT_SECRET: "ci-test-secret-that-is-at-least-32-chars"
          NODE_ENV: test
          DIRECT_WORKER: "false"
          DOWNLOAD_DIR: /tmp/downloads
          STORAGE_PROVIDER: local
        run: |
          npx prisma db push --skip-generate
          npm test

      - name: Build
        run: npm run build

  # ─── Frontend ────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend (lint · typecheck · test · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Run unit tests
        run: npm test

      - name: Build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000
        run: npm run build

  # ─── E2E (runs after both pass) ──────────────────────────────────────────────
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    # Only run E2E on PRs and main pushes to save CI minutes
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Install backend deps
        working-directory: backend
        run: npm ci

      - name: Prepare backend for E2E
        working-directory: backend
        env:
          DATABASE_URL: "file:/tmp/e2e.db"
          JWT_SECRET: "ci-e2e-secret-that-is-at-least-32-chars"
          DIRECT_WORKER: "false"
          DOWNLOAD_DIR: /tmp/downloads
          STORAGE_PROVIDER: local
        run: |
          npx prisma generate
          npx prisma db push --skip-generate
          npm run build

      - name: Start backend
        working-directory: backend
        env:
          DATABASE_URL: "file:/tmp/e2e.db"
          JWT_SECRET: "ci-e2e-secret-that-is-at-least-32-chars"
          DIRECT_WORKER: "false"
          DOWNLOAD_DIR: /tmp/downloads
          STORAGE_PROVIDER: local
          PORT: 4000
          NODE_ENV: production
        run: node dist/index.js &

      - name: Run Playwright tests
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # ─── Docker build check ──────────────────────────────────────────────────────
  docker:
    name: Docker build check
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          build-args: |
            NEXT_PUBLIC_API_URL=http://localhost:4000
          cache-from: type=gha
          cache-to: type=gha,mode=max
